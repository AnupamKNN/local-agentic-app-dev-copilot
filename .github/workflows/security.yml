name: Security Regression Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  write-authorization:
    name: Write Authorization Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COVERAGE_FILE: ${{ runner.temp }}/.coverage

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install minimal test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "fastmcp==3.4.7" \
            "pytest==9.1.1" \
            "coverage==7.16.2"

      - name: Run write-authorization tests with branch coverage
        run: |
          python -m coverage run \
            --rcfile=/dev/null \
            --branch \
            -m pytest \
            -p no:cacheprovider \
            tests/security/test_write_authorization.py \
            -q \
            --tb=short

      - name: Enforce MCP server coverage floor
        run: |
          python -m coverage report \
            --rcfile=/dev/null \
            --include="${GITHUB_WORKSPACE}/research_notebooks/agents/_mcp_sandbox_server.py" \
            --show-missing \
            --fail-under=95
